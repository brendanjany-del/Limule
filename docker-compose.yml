version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: limule
      POSTGRES_USER: limule
      POSTGRES_PASSWORD: limule_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limule"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://limule:limule_secret@db:5432/limule
      DATABASE_URL_SYNC: postgresql+psycopg2://limule:limule_secret@db:5432/limule
      REDIS_URL: redis://redis:6379/0
      DATA_INPUT_DIR: /app/data/input
      DATA_OUTPUT_DIR: /app/data/output
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A app.worker worker -l info -c 4
    environment:
      DATABASE_URL: postgresql+asyncpg://limule:limule_secret@db:5432/limule
      DATABASE_URL_SYNC: postgresql+psycopg2://limule:limule_secret@db:5432/limule
      REDIS_URL: redis://redis:6379/0
      DATA_INPUT_DIR: /app/data/input
      DATA_OUTPUT_DIR: /app/data/output
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
